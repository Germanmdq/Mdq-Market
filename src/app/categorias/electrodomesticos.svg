<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="fridgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="32" fill="transparent"/>
  
  <g filter="url(#softShadow)" transform="translate(80, 40)">
    <!-- Fridge -->
    <rect x="20" y="20" width="90" height="170" rx="8" fill="url(#fridgeGrad)" stroke="#cbd5e1" stroke-width="4"/>
    <line x1="20" y1="80" x2="110" y2="80" stroke="#cbd5e1" stroke-width="4"/>
    <rect x="90" y="40" width="4" height="25" rx="2" fill="#94a3b8"/>
    <rect x="90" y="90" width="4" height="40" rx="2" fill="#94a3b8"/>
    <rect x="35" y="95" width="20" height="30" rx="4" fill="#cbd5e1"/>
    <rect x="40" y="100" width="10" height="20" rx="2" fill="#3b82f6" opacity="0.4"/>

    <!-- Washing Machine -->
    <rect x="130" y="100" width="80" height="90" rx="8" fill="url(#fridgeGrad)" stroke="#cbd5e1" stroke-width="4"/>
    <line x1="130" y1="125" x2="210" y2="125" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="145" cy="112" r="5" fill="#94a3b8"/>
    <circle cx="165" cy="112" r="2" fill="#cbd5e1"/>
    <circle cx="175" cy="112" r="2" fill="#cbd5e1"/>
    
    <!-- Drum -->
    <circle cx="170" cy="155" r="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="170" cy="155" r="16" fill="#3b82f6" opacity="0.15"/>
  </g>
</svg>