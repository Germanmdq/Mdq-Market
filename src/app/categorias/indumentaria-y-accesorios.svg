<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="jacketGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="32" fill="transparent"/>
  
  <g filter="url(#softShadow)" transform="translate(70, 40)">
    <!-- Clothing rack -->
    <line x1="30" y1="20" x2="220" y2="20" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="20" x2="60" y2="180" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="190" y1="20" x2="190" y2="180" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Hanger & Jacket -->
    <path d="M 125 20 C 125 10 135 10 135 20 L 100 45 L 160 45 Z" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 130 45 C 155 45 165 55 170 80 L 155 150 L 105 150 L 90 80 C 95 55 105 45 130 45 Z" fill="url(#jacketGrad)" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 115 45 L 130 65 L 145 45" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round"/>
    <line x1="130" y1="65" x2="130" y2="150" stroke="#94a3b8" stroke-width="3"/>
    
    <!-- Handbag -->
    <rect x="195" y="100" width="50" height="40" rx="8" fill="#bc8f8f" stroke="#a0522d" stroke-width="3"/>
    <path d="M 205 100 C 205 80 235 80 235 100" fill="none" stroke="#a0522d" stroke-width="4" stroke-linecap="round"/>
    <circle cx="220" cy="115" r="4" fill="#fbbf24"/>
    
    <!-- Sneaker -->
    <path d="M 20 160 L 55 160 C 65 160 70 165 70 175 L 70 180 L 10 180 L 10 170 C 10 160 15 160 20 160 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 10 170 C 25 165 35 165 55 170" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="10" y="180" width="60" height="8" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  </g>
</svg>