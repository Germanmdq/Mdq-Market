<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="boxGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <!-- Fondo transparente/suave -->
  <rect width="400" height="300" rx="32" fill="transparent"/>
  
  <!-- Escena abstracta: Marketplace Box moderna -->
  <g filter="url(#softShadow)" transform="translate(100, 60)">
    <rect x="20" y="40" width="160" height="120" rx="24" fill="url(#boxGradient)" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M60 80h80M60 110h50" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="40" fill="#3b82f6" opacity="0.1"/>
    <path d="M85 100l10 10 20-20" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>