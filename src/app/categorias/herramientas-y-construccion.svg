<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="drillGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="32" fill="transparent"/>
  
  <g filter="url(#softShadow)" transform="translate(60, 60)">
    <!-- Toolbox -->
    <path d="M 130 140 L 250 140 L 240 80 L 140 80 Z" fill="#334155" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 135 80 L 245 80 L 235 50 L 145 50 Z" fill="#475569" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 170 50 L 170 35 L 210 35 L 210 50" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="180" y="75" width="20" height="10" rx="2" fill="#cbd5e1"/>

    <!-- Hammer -->
    <rect x="55" y="100" width="12" height="55" rx="4" fill="#b45309"/>
    <path d="M 40 100 L 85 100 L 80 75 L 45 75 Z" fill="#94a3b8" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 40 100 Q 20 85 45 75" fill="#94a3b8" stroke="#64748b" stroke-width="3"/>

    <!-- Drill -->
    <path d="M 60 160 L 105 160 L 100 120 L 75 120 Z" fill="url(#drillGrad)" stroke="#9a3412" stroke-width="3" stroke-linejoin="round"/>
    <rect x="95" y="130" width="30" height="15" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
    <path d="M 70 160 L 85 190 L 70 195 L 55 160 Z" fill="#1e293b"/>
    <rect x="80" y="162" width="6" height="12" rx="2" fill="#ef4444"/>
    <rect x="60" y="195" width="35" height="15" rx="4" fill="#334155"/>
  </g>
</svg>